<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resources: links with no purpose</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      a { color: #1a4f8b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Resources</h1>
      <!-- Seeded barrier: identical "Click here" links to different places, with no context
           in the link, its sentence or its list item (2.4.4). -->
      <ul>
        <li><a id="link-1" href="#guide">Click here</a></li>
        <li><a id="link-2" href="#checklist">Click here</a></li>
        <li><a id="link-3" href="#webinar">Click here</a></li>
      </ul>
    </main>
  </body>
</html>
