<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notice: icon button without a name</title>
  </head>
  <body>
    <main>
      <h1>Account</h1>
      <div class="notice">
        <p>Your trial ends in 3 days.</p>
        <!-- Seeded barrier: icon-only button with no accessible name (4.1.2). -->
        <button id="close-notice" type="button">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="2" /></svg>
        </button>
      </div>
    </main>
  </body>
</html>
