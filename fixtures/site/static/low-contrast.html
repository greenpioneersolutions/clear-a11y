<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pricing: low contrast text</title>
    <style>
      body { background: #ffffff; color: #1a1a1a; font: 16px/1.5 system-ui, sans-serif; }
      #fine-print { color: #b0b0b0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pricing</h1>
      <p>Pro plan: 12 euros per month.</p>
      <!-- Seeded barrier: #b0b0b0 on white is about 2.1:1 (1.4.3 needs 4.5:1). -->
      <p id="fine-print">Prices exclude VAT. Cancel any time before renewal.</p>
    </main>
  </body>
</html>
