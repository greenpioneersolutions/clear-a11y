<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pricing: plan cards scroll sideways</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      main { padding: 16px; }
      /* Seeded barrier: at narrow widths the plan cards stay in one row and the region scrolls
         horizontally. Plain text cards don't need a two-dimensional layout (1.4.10). */
      #plans { display: flex; gap: 16px; overflow-x: auto; }
      .plan { flex: 0 0 240px; border: 1px solid #555; padding: 12px; }
      .plan h2 { margin: 0 0 8px; font-size: 1.25rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Pricing</h1>
      <div id="plans">
        <section class="plan"><h2>Starter</h2><p>One project and community support.</p></section>
        <section class="plan"><h2>Team</h2><p>Unlimited projects and shared fixtures.</p></section>
        <section class="plan"><h2>Enterprise</h2><p>Single sign-on and priority support.</p></section>
      </div>
    </main>
  </body>
</html>
