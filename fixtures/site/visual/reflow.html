<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Article: fixed width breaks reflow</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      /* Seeded barrier: fixed 1100px column forces two-dimensional scrolling at 320px wide (1.4.10). */
      #content { width: 1100px; margin: 0 auto; padding: 16px; }
    </style>
  </head>
  <body>
    <main id="content">
      <h1>How we test accessibility</h1>
      <p>We combine automated checks with manual testing by people who use assistive technology every day. Each release goes through keyboard testing, screen reader testing and zoom testing before it ships.</p>
    </main>
  </body>
</html>
