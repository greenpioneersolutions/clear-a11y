<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timetable: adapts to both orientations</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      main { padding: 16px; max-width: 48rem; }
      .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #595959; padding: 4px 8px; text-align: left; }
      .tip { display: none; margin: 0 0 12px; color: #3d3d3d; }
      /* Correct pattern (SC 1.3.4): portrait only changes the layout to one column. The tip about
         rotating is advice next to content that stays fully usable, not a restriction. */
      @media (orientation: portrait) {
        .layout { grid-template-columns: 1fr; }
        .tip { display: block; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bus 12 timetable</h1>
      <p class="tip" id="rotate-tip">Tip: rotate your phone for a wider view of the table.</p>
      <div class="layout">
        <section aria-labelledby="times-title">
          <h2 id="times-title">Departures from Central Station</h2>
          <table>
            <thead>
              <tr><th scope="col">Stop</th><th scope="col">First bus</th><th scope="col">Last bus</th></tr>
            </thead>
            <tbody>
              <tr><td>Central Station</td><td>06:10</td><td>23:40</td></tr>
              <tr><td>Market Square</td><td>06:16</td><td>23:46</td></tr>
              <tr><td>University</td><td>06:24</td><td>23:54</td></tr>
            </tbody>
          </table>
        </section>
        <aside aria-labelledby="notes-title">
          <h2 id="notes-title">Notes</h2>
          <p>Buses run every 12 minutes during the day and every 30 minutes after 20:00.</p>
        </aside>
      </div>
    </main>
  </body>
</html>
