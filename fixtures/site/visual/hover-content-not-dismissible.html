<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout: help tooltip can't be dismissed</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      main { padding: 16px; max-width: 40rem; }
      .has-tip { position: relative; }
      #help-wrap { display: inline-block; }
      #help-trigger { min-width: 32px; min-height: 32px; font: inherit; }
      /* Seeded barrier: a CSS-only tooltip shown on hover and focus. It covers the paragraph
         below and nothing closes it except moving the pointer or focus away (1.4.13). */
      #help-tip {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 280px;
        max-width: calc(100vw - 48px);
        padding: 8px;
        color: #ffffff;
        background: #1a1a1a;
      }
      #help-wrap:hover #help-tip,
      #help-wrap:focus-within #help-tip { display: block; }
    </style>
  </head>
  <body>
    <main>
      <h1>Payment</h1>
      <p class="has-tip">
        Security code
        <span id="help-wrap">
          <button id="help-trigger" type="button" aria-describedby="help-tip">?</button>
          <span id="help-tip" role="tooltip">The three digits on the back of your card, next to the signature strip.</span>
        </span>
      </p>
      <p>We never store your security code. It is sent once to your bank to confirm the payment and then discarded.</p>
    </main>
  </body>
</html>
