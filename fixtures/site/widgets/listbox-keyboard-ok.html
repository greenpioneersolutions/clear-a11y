<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Correct pattern: single-select listbox</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      [role='listbox'] { max-width: 200px; margin: 0; padding: 0; list-style: none; border: 1px solid #555; }
      [role='option'] { padding: 6px 8px; cursor: pointer; }
      [role='option'][aria-selected='true'] { background: #1a5fb4; color: #fff; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Trail running shoe</h1>
      <h2 id="size-label">Size</h2>
      <!-- Correct pattern, rewritten from the ARIA Authoring Practices Guide "Listbox" single-select
           example (https://www.w3.org/WAI/ARIA/apg/patterns/listbox/): the listbox is tabbable,
           Up/Down Arrow, Home and End move the active option with aria-activedescendant, and
           selection follows focus through aria-selected. -->
      <ul role="listbox" id="size-list" tabindex="0" aria-labelledby="size-label" aria-activedescendant="size-41">
        <li role="option" id="size-41" aria-selected="true">EU 41</li>
        <li role="option" id="size-42" aria-selected="false">EU 42</li>
        <li role="option" id="size-43" aria-selected="false">EU 43</li>
        <li role="option" id="size-44" aria-selected="false">EU 44</li>
      </ul>
    </main>
    <script>
      const list = document.getElementById('size-list');
      const options = [...list.querySelectorAll('[role=option]')];
      let current = 0;
      function choose(index) {
        current = Math.max(0, Math.min(options.length - 1, index));
        options.forEach((o, i) => o.setAttribute('aria-selected', String(i === current)));
        list.setAttribute('aria-activedescendant', options[current].id);
      }
      list.addEventListener('keydown', (event) => {
        const next = { ArrowDown: current + 1, ArrowUp: current - 1, Home: 0, End: options.length - 1 }[event.key];
        if (next === undefined) return;
        event.preventDefault();
        choose(next);
      });
      options.forEach((o, i) => o.addEventListener('click', () => choose(i)));
    </script>
  </body>
</html>
