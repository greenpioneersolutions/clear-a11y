<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search results: dialogs without focus or name</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      .backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / 0.5); display: grid; place-items: center; }
      .backdrop[hidden] { display: none; }
      [role='dialog'] { background: #fff; padding: 24px; border-radius: 8px; width: min(420px, 90vw); }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Trail running shoes</h1>
      <p>
        <button type="button" id="open-filters" aria-haspopup="dialog" aria-controls="filters-dialog">Filters</button>
        <button type="button" id="open-share" aria-haspopup="dialog" aria-controls="share-dialog">Share</button>
      </p>
    </main>
    <!-- Seeded barrier 1: opening Filters leaves focus on the button behind the dialog (2.4.3). -->
    <div class="backdrop" id="filters-backdrop" hidden>
      <div role="dialog" id="filters-dialog" aria-modal="true" aria-labelledby="filters-title">
        <h2 id="filters-title">Filters</h2>
        <label><input type="checkbox" id="filter-waterproof" /> Waterproof</label>
        <p><button type="button" id="close-filters">Show results</button></p>
      </div>
    </div>
    <!-- Seeded barrier 2: the share dialog moves focus correctly but has no accessible name, so
         screen readers announce only "dialog" (4.1.2). -->
    <div class="backdrop" id="share-backdrop" hidden>
      <div role="dialog" id="share-dialog" aria-modal="true">
        <p class="title">Share this page</p>
        <label for="share-link">Link</label>
        <input id="share-link" value="https://shop.example/trail" readonly />
        <p><button type="button" id="close-share">Done</button></p>
      </div>
    </div>
    <script>
      const pair = (openId, backdropId, closeId, focusId) => {
        const opener = document.getElementById(openId);
        const backdrop = document.getElementById(backdropId);
        opener.addEventListener('click', () => {
          backdrop.hidden = false;
          if (focusId) document.getElementById(focusId).focus();
        });
        document.getElementById(closeId).addEventListener('click', () => {
          backdrop.hidden = true;
          opener.focus();
        });
      };
      pair('open-filters', 'filters-backdrop', 'close-filters', null);
      pair('open-share', 'share-backdrop', 'close-share', 'share-link');
    </script>
  </body>
</html>
