<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Correct pattern: tabs</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      [role='tablist'] { display: flex; gap: 4px; }
      [role='tab'] { padding: 8px 16px; border: 1px solid #555; background: #fff; color: #1a1a1a; font: inherit; }
      [role='tab'][aria-selected='true'] { background: #1a5fb4; color: #fff; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Trail running shoe</h1>
      <div role="tablist" aria-label="Product details">
        <button role="tab" id="tab-1" aria-selected="true" aria-controls="panel-1" tabindex="0">Description</button>
        <button role="tab" id="tab-2" aria-selected="false" aria-controls="panel-2" tabindex="-1">Sizing</button>
        <button role="tab" id="tab-3" aria-selected="false" aria-controls="panel-3" tabindex="-1">Reviews</button>
      </div>
      <div role="tabpanel" id="panel-1" aria-labelledby="tab-1" tabindex="0"><p>Lightweight shoe with a grippy sole.</p></div>
      <div role="tabpanel" id="panel-2" aria-labelledby="tab-2" tabindex="0" hidden><p>Runs half a size small.</p></div>
      <div role="tabpanel" id="panel-3" aria-labelledby="tab-3" tabindex="0" hidden><p>4.6 out of 5 from 120 reviews.</p></div>
    </main>
    <script>
      const tabs = [...document.querySelectorAll('[role=tab]')];
      function select(tab) {
        for (const t of tabs) {
          const selected = t === tab;
          t.setAttribute('aria-selected', String(selected));
          t.tabIndex = selected ? 0 : -1;
          document.getElementById(t.getAttribute('aria-controls')).hidden = !selected;
        }
        tab.focus();
      }
      tabs.forEach((tab, i) => {
        tab.addEventListener('click', () => select(tab));
        tab.addEventListener('keydown', (event) => {
          const next = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[event.key];
          if (next === undefined) return;
          event.preventDefault();
          select(tabs[(next + tabs.length) % tabs.length]);
        });
      });
    </script>
  </body>
</html>
