<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Delivery country: combobox state shown only visually</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      .combo { position: relative; max-width: 320px; }
      .combo input { width: 100%; font: inherit; padding: 6px 8px; box-sizing: border-box; }
      [role='listbox'] { position: absolute; left: 0; right: 0; margin: 2px 0 0; padding: 0; list-style: none; background: #fff; border: 1px solid #555; }
      [role='option'] { padding: 6px 8px; cursor: pointer; }
      [role='option'].is-active { background: #1a5fb4; color: #fff; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Delivery address</h1>
      <!-- Seeded barrier: the list opens and Down Arrow highlights options, but aria-expanded stays
           "false" and the highlight is only a CSS class (no aria-activedescendant, focus stays in the
           input), so screen reader users hear nothing about the list or the active option (4.1.2). -->
      <label for="country-combobox">Country</label>
      <div class="combo">
        <input id="country-combobox" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="country-list" autocomplete="off" />
        <ul role="listbox" id="country-list" aria-label="Countries" hidden>
          <li role="option" id="country-be">Belgium</li>
          <li role="option" id="country-de">Germany</li>
          <li role="option" id="country-fr">France</li>
          <li role="option" id="country-nl">Netherlands</li>
        </ul>
      </div>
    </main>
    <script>
      const input = document.getElementById('country-combobox');
      const list = document.getElementById('country-list');
      const options = [...list.querySelectorAll('[role=option]')];
      let active = -1;
      const visible = () => options.filter((o) => !o.hidden);
      function openList() {
        const q = input.value.toLowerCase();
        for (const o of options) o.hidden = !o.textContent.toLowerCase().startsWith(q);
        list.hidden = visible().length === 0;
      }
      function highlight(index) {
        const shown = visible();
        active = (index + shown.length) % shown.length;
        options.forEach((o) => o.classList.toggle('is-active', o === shown[active]));
      }
      input.addEventListener('input', () => { active = -1; openList(); });
      input.addEventListener('click', openList);
      input.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowDown') {
          event.preventDefault();
          if (list.hidden) openList();
          else highlight(active + 1);
        } else if (event.key === 'Enter' && active >= 0) {
          event.preventDefault();
          input.value = visible()[active].textContent;
          list.hidden = true;
        } else if (event.key === 'Escape') {
          list.hidden = true;
        }
      });
      for (const o of options) {
        o.addEventListener('click', () => { input.value = o.textContent; list.hidden = true; });
      }
    </script>
  </body>
</html>
