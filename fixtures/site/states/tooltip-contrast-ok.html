<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout: readable tooltip text</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      .tip-wrap { display: inline-block; }
      #ship-help { font: inherit; padding: 4px 12px; }
      .tip { display: block; margin-top: 4px; padding: 4px 8px; border: 1px solid #1a1a1a; background: #1a1a1a; color: #ffffff; font-size: 14px; max-width: 280px; }
      .tip[hidden] { display: none; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Checkout</h1>
      <p>Order total: 64.00 EUR</p>
      <!-- Correct pattern: the tooltip text has strong contrast, shows on hover and focus, stays
           while hovered and closes with Escape. -->
      <div class="tip-wrap" id="ship-wrap">
        <button id="ship-help" type="button" aria-describedby="ship-tip">Shipping costs</button>
        <span id="ship-tip" class="tip" role="tooltip" hidden>
          Free shipping on orders over 50 EUR. Otherwise 4.90 EUR.
        </span>
      </div>
    </main>
    <script>
      const wrap = document.getElementById('ship-wrap');
      const tip = document.getElementById('ship-tip');
      const show = () => (tip.hidden = false);
      const hide = () => (tip.hidden = true);
      wrap.addEventListener('mouseenter', show);
      wrap.addEventListener('mouseleave', hide);
      wrap.addEventListener('focusin', show);
      wrap.addEventListener('focusout', hide);
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') hide();
      });
    </script>
  </body>
</html>
