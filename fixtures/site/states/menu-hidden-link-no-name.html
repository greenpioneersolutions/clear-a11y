<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Outdoor shop: icon link without a name inside the menu</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; margin: 0; }
      header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid #5e5c64; }
      #menu-toggle { font: inherit; padding: 8px 12px; }
      #site-menu ul { list-style: none; margin: 0; padding: 8px 16px; display: flex; flex-direction: column; gap: 8px; }
      #site-menu a { color: #1a5fb4; display: inline-flex; align-items: center; min-height: 24px; }
      main { padding: 16px; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header>
      <span>Trailhead Outdoor</span>
      <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">
        Menu
      </button>
    </header>
    <!-- Seeded barrier (2.4.4, 4.1.2): the account link inside the collapsed menu is an icon with
         no accessible name. It is hidden until the menu opens, so a scan of the default state
         never sees it. Expected findings: fixtures/expected/states/menu-hidden-link-no-name.json -->
    <nav id="site-menu" aria-label="Main" hidden>
      <ul>
        <li><a href="/shop">Shop</a></li>
        <li><a href="/stores">Stores</a></li>
        <li>
          <a id="menu-account" href="/account">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="8" r="4" fill="currentColor" />
              <path d="M4 21c0-4 4-6 8-6s8 2 8 6" fill="currentColor" />
            </svg>
          </a>
        </li>
      </ul>
    </nav>
    <main>
      <h1>New season jackets</h1>
      <p>Waterproof shells for every trail.</p>
    </main>
    <script>
      const toggle = document.getElementById('menu-toggle');
      const menu = document.getElementById('site-menu');
      toggle.addEventListener('click', () => {
        const open = menu.hidden;
        menu.hidden = !open;
        toggle.setAttribute('aria-expanded', String(open));
      });
    </script>
  </body>
</html>
