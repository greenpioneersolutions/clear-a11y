<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up: errors not identified or announced</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      .field { display: flex; flex-direction: column; max-width: 360px; margin-bottom: 16px; }
      .error { color: #c01c28; font-size: 14px; }
      .invalid { border: 2px solid #c01c28; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Create an account</h1>
      <!-- Seeded barriers (visible after submitting empty): error text is not tied to the field
           (no aria-invalid / aria-describedby, 3.3.1) and is injected silently (no live region, 4.1.3). -->
      <form id="signup" action="#" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" />
          <span id="email-error" class="error"></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="new-password" />
          <span id="password-error" class="error"></span>
        </div>
        <button type="submit">Create account</button>
      </form>
    </main>
    <script>
      document.getElementById('signup').addEventListener('submit', (event) => {
        event.preventDefault();
        for (const id of ['email', 'password']) {
          const input = document.getElementById(id);
          const error = document.getElementById(id + '-error');
          if (!input.value) {
            input.classList.add('invalid');
            error.textContent = 'Required';
          } else {
            input.classList.remove('invalid');
            error.textContent = '';
          }
        }
      });
    </script>
  </body>
</html>
