<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Help: dialog moves focus inside</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      .backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / 0.5); display: grid; place-items: center; }
      .backdrop[hidden] { display: none; }
      [role='dialog'] { background: #fff; padding: 24px; border-radius: 8px; width: min(420px, 90vw); }
      [role='dialog']:focus-visible { outline: 3px solid #1a5fb4; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Your orders</h1>
      <button id="open-help" type="button" aria-haspopup="dialog">Get help</button>
      <p><a href="#orders">Order history</a></p>
    </main>
    <!-- Correct pattern: opening the dialog moves focus to the dialog itself (tabindex="-1"),
         so screen readers announce its title; Escape and Close return focus to Get help. -->
    <div class="backdrop" id="backdrop" hidden>
      <div id="help-dialog" role="dialog" aria-modal="true" aria-labelledby="help-title" tabindex="-1">
        <h2 id="help-title">Get help</h2>
        <p><a id="help-chat" href="#chat">Chat with us</a></p>
        <p><button id="close-help" type="button">Close</button></p>
      </div>
    </div>
    <script>
      const backdrop = document.getElementById('backdrop');
      const dialog = document.getElementById('help-dialog');
      const opener = document.getElementById('open-help');
      const close = () => {
        backdrop.hidden = true;
        opener.focus();
      };
      opener.addEventListener('click', () => {
        backdrop.hidden = false;
        dialog.focus();
      });
      document.getElementById('close-help').addEventListener('click', close);
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !backdrop.hidden) close();
      });
    </script>
  </body>
</html>
