<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Correct pattern: keyboard</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 640px; }
      /* min-width: 0 lets the two columns shrink below the inputs' default width at 320px (1.4.10). */
      .field { display: flex; flex-direction: column; min-width: 0; }
      .wide { grid-column: 1 / span 2; }
      nav ul { display: flex; gap: 24px; list-style: none; padding: 0; }
      nav a { color: #1a1a1a; padding: 8px; }
      a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 3px solid #1a5fb4;
        outline-offset: 2px;
      }
      .skip { position: absolute; left: -9999px; }
      .skip:focus { left: 8px; top: 8px; background: #fff; padding: 8px; }
    </style>
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <header>
      <nav aria-label="Main">
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#pricing">Pricing</a></li>
        </ul>
      </nav>
    </header>
    <main id="content" tabindex="-1">
      <h1>Shipping address</h1>
      <form action="#">
        <div class="field">
          <label for="first-name">First name</label>
          <input id="first-name" autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="last-name">Last name</label>
          <input id="last-name" autocomplete="family-name" />
        </div>
        <div class="field wide">
          <label for="country">Country</label>
          <select id="country" autocomplete="country-name">
            <option>Belgium</option>
            <option>Netherlands</option>
          </select>
        </div>
        <div class="field wide">
          <label for="comment">Delivery notes</label>
          <textarea id="comment"></textarea>
        </div>
        <button type="submit">Continue</button>
      </form>
      <p><button type="button" id="pay">Pay now</button></p>
    </main>
  </body>
</html>
