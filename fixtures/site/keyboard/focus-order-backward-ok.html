<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shipping form: focus order follows the visual order</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 640px; }
      .field { display: flex; flex-direction: column; min-width: 0; }
      input, select { max-width: 100%; }
      @media (max-width: 480px) { form { grid-template-columns: 1fr; } }
      .wide { grid-column: 1 / span 2; }
      button { justify-self: start; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Shipping address</h1>
      <!-- Correct pattern: DOM order matches the visual grid, so Tab goes row by row. -->
      <form action="#">
        <div class="field">
          <label for="first-name">First name</label>
          <input id="first-name" autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="last-name">Last name</label>
          <input id="last-name" autocomplete="family-name" />
        </div>
        <div class="field wide">
          <label for="country">Country</label>
          <select id="country" autocomplete="country-name">
            <option>Belgium</option>
            <option>Netherlands</option>
          </select>
        </div>
        <button id="submit" type="submit">Continue</button>
      </form>
    </main>
  </body>
</html>
