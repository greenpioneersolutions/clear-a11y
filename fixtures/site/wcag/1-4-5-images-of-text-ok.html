<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sale banner as styled text</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0 16px; }
      a { color: #1a4f8b; }
      button { font: inherit; }
      img, video, audio { max-width: 100%; }
      img, video { height: auto; }
      figure { margin: 16px 0; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
      .banner { background: #7a1f1f; color: #fff; padding: 16px; font-size: 1.5rem; max-width: 600px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Lakeside Outdoor</h1>
      <!-- Correct pattern: the promotion is real text styled with CSS. -->
      <p class="banner"><strong>Summer sale: 50% off all jackets</strong><br />This weekend only</p>
      <p>Free delivery on orders over £50.</p>
    </main>
  </body>
</html>
