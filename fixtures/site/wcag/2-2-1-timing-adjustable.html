<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta id="auto-refresh" http-equiv="refresh" content="300" />
    <title>Live scores page that reloads itself</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0 16px; }
      a { color: #1a4f8b; }
      button { font: inherit; }
      img, video, audio { max-width: 100%; }
      img, video { height: auto; }
      figure { margin: 16px 0; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
      table { border-collapse: collapse; }
      td, th { border: 1px solid #767676; padding: 4px 8px; text-align: left; }
      .head { font-weight: bold; background: #f0f0f0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Live scores</h1>
      <!-- Seeded barrier: a meta refresh reloads the page every 5 minutes; users can't turn it off,
           adjust it or extend it, and lose their place. WCAG 2.2.1. -->
      <p>This page updates automatically.</p>
      <table id="scores">
        <caption>Saturday's results</caption>
        <tr><th scope="col">Home</th><th scope="col">Score</th><th scope="col">Away</th></tr>
        <tr><td>Riverside</td><td>2 to 1</td><td>Hillford</td></tr>
        <tr><td>Northgate</td><td>0 to 0</td><td>Easton</td></tr>
      </table>
    </main>
  </body>
</html>
