<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assembly video with an audio-described version</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0 16px; }
      a { color: #1a4f8b; }
      button { font: inherit; }
      img, video, audio { max-width: 100%; }
      img, video { height: auto; }
      figure { margin: 16px 0; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
      figure { margin: 16px 0; max-width: 480px; }
      video { background: #222; display: block; }
    </style>
  </head>
  <body>
    <main>
      <h1>Assembling the bike stand</h1>
      <!-- Correct pattern: captions, a transcript, and an audio-described version of the video. -->
      <figure>
        <video id="assembly-video" controls width="480" height="270" preload="none">
          <source src="../_assets/media/bike-stand.mp4" type="video/mp4" />
          <track kind="captions" src="../_assets/media/bike-stand.en.vtt" srclang="en" label="English" default />
        </video>
        <figcaption>Assembly, 4 minutes. <a href="#transcript">Read the transcript</a> or
          <a href="../_assets/media/bike-stand-described.mp4">watch the audio-described version</a>.</figcaption>
      </figure>
      <section id="transcript" aria-labelledby="transcript-title">
        <h2 id="transcript-title">Transcript</h2>
        <p>[The base is placed on the floor and the two legs are clicked into it.] Narrator: Then tighten it.</p>
      </section>
    </main>
  </body>
</html>
