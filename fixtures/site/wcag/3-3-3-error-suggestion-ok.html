<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign-up form with a date error that suggests a fix</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0 16px; }
      a { color: #1a4f8b; }
      button { font: inherit; }
      img, video, audio { max-width: 100%; }
      img, video { height: auto; }
      figure { margin: 16px 0; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
      .field { display: flex; flex-direction: column; max-width: 360px; margin-bottom: 16px; }
      input { font: inherit; border: 2px solid #767676; }
      input[aria-invalid='true'] { border-color: #c01c28; background: #fdecec; }
      .hint { color: #4d4d4d; font-size: 14px; }
      .error { color: #a51d2d; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Create your account</h1>
      <!-- Correct pattern: a format hint, and an error that says exactly what to enter. -->
      <form id="signup" action="#" novalidate>
        <div class="field">
          <label for="dob">Date of birth</label>
          <span id="dob-hint" class="hint">For example, 07 03 1985</span>
          <input id="dob" autocomplete="bday" inputmode="numeric" aria-describedby="dob-hint dob-error" />
          <span id="dob-error" class="error"></span>
        </div>
        <button type="submit">Continue</button>
      </form>
    </main>
    <script>
      document.getElementById('signup').addEventListener('submit', (event) => {
        event.preventDefault();
        const input = document.getElementById('dob');
        const valid = /^\d{2} \d{2} \d{4}$/.test(input.value.trim());
        if (valid) input.removeAttribute('aria-invalid');
        else input.setAttribute('aria-invalid', 'true');
        document.getElementById('dob-error').textContent = valid ? '' : 'Enter your date of birth as day, month and year, for example 07 03 1985.';
        if (!valid) input.focus();
      });
    </script>
  </body>
</html>
