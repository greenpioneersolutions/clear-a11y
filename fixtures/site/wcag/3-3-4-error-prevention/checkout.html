<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout: pay now</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0 16px; }
      a { color: #1a4f8b; }
      button { font: inherit; }
      img, video, audio { max-width: 100%; }
      img, video { height: auto; }
      figure { margin: 16px 0; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Checkout</h1>
      <!-- Seeded barrier (with placed.html): one press charges the card. There is no review step, no
           confirmation and no way to cancel the order afterwards. WCAG 3.3.4. -->
      <ul>
        <li>2-person tent: £180.00</li>
        <li>Delivery: £4.00</li>
      </ul>
      <p>Paying with the saved card ending 4242. Delivering to 12 Mill Lane, Ghent.</p>
      <form id="checkout" action="placed.html">
        <input type="hidden" name="order" value="1042" />
        <button type="submit" id="pay-now">Pay £184.00 now</button>
      </form>
    </main>
  </body>
</html>
