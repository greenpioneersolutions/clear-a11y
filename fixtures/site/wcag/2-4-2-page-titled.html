<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0 16px; }
      a { color: #1a4f8b; }
      button { font: inherit; }
      img, video, audio { max-width: 100%; }
      img, video { height: auto; }
      figure { margin: 16px 0; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Your orders</h1>
      <!-- Seeded barrier: the page has no <title>, so browser tabs, history and screen readers
           have nothing to identify it by. WCAG 2.4.2. -->
      <ul>
        <li>Order 1042: trail shoes, delivered 3 October</li>
        <li>Order 1017: rain jacket, delivered 12 September</li>
      </ul>
    </main>
  </body>
</html>
