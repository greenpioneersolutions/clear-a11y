<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout step 2: billing address</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0 16px; }
      a { color: #1a4f8b; }
      button { font: inherit; }
      img, video, audio { max-width: 100%; }
      img, video { height: auto; }
      figure { margin: 16px 0; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
      .field { display: flex; flex-direction: column; max-width: 360px; margin-bottom: 12px; }
      input, select { font: inherit; border: 2px solid #767676; padding: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Step 2 of 2: Billing address</h1>
      <form id="billing-form" action="#">
        <p><label><input type="checkbox" id="same-address" checked /> Billing address is the same as the delivery address (12 Mill Lane, Ghent, 9000)</label></p>
        <fieldset id="billing-fields" hidden>
          <legend>Billing address</legend>
        <div class="field">
          <label for="bill-line1">Address line 1</label>
          <input id="bill-line1" name="bill-line1" autocomplete="billing address-line1" />
        </div>
        <div class="field">
          <label for="bill-city">Town or city</label>
          <input id="bill-city" name="bill-city" autocomplete="billing address-level2" />
        </div>
        <div class="field">
          <label for="bill-postcode">Postcode</label>
          <input id="bill-postcode" name="bill-postcode" autocomplete="billing postal-code" />
        </div>
        </fieldset>
        <button type="submit">Pay now</button>
      </form>
    </main>
    <script>
      document.getElementById('same-address').addEventListener('change', (e) => {
        document.getElementById('billing-fields').hidden = e.target.checked;
      });
    </script>
  </body>
</html>
