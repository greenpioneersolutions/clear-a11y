<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Help article with descriptive headings</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0 16px; }
      a { color: #1a4f8b; }
      button { font: inherit; }
      img, video, audio { max-width: 100%; }
      img, video { height: auto; }
      figure { margin: 16px 0; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Help with orders</h1>
      <!-- Correct pattern: every heading names its topic. -->
      <h2 id="heading-1">Delivery times</h2>
      <p>Orders usually arrive in 3 to 5 working days. You can track them from your account.</p>
      <h2 id="heading-2">Returns and refunds</h2>
      <p>You can return unused items within 30 days for a full refund.</p>
      <h2 id="heading-3">Contact support</h2>
      <p>Our support team answers emails within one working day.</p>
    </main>
  </body>
</html>
