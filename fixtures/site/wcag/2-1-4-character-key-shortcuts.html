<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>News page with single-key shortcuts</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0 16px; }
      a { color: #1a4f8b; }
      button { font: inherit; }
      img, video, audio { max-width: 100%; }
      img, video { height: auto; }
      figure { margin: 16px 0; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
      .story { padding: 8px; border: 2px solid transparent; }
      .story.current { border-color: #1a4f8b; }
      .field { display: flex; flex-direction: column; max-width: 360px; margin-bottom: 12px; }
      input { font: inherit; border: 2px solid #767676; padding: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Today's stories</h1>
      <!-- Seeded barrier: J, K and S work as shortcuts with no modifier, anywhere on the page, and
           can't be turned off. WCAG 2.1.4. -->
      <p>Keyboard shortcuts: J and K move between stories, S jumps to search.</p>
      <div class="field">
        <label for="story-search">Search stories</label>
        <input id="story-search" type="search" />
      </div>
      <p id="position">Story 1 of 3</p>
      <article class="story current"><h2>Harbour bridge reopens</h2><p>Traffic is back to normal.</p></article>
      <article class="story"><h2>New library hours</h2><p>Open until 9pm on weekdays.</p></article>
      <article class="story"><h2>Weekend market returns</h2><p>Over 40 stalls on Saturday.</p></article>
    </main>
    <script>
      const stories = Array.from(document.querySelectorAll('.story'));
      let current = 0;
      const show = (i) => {
        current = Math.max(0, Math.min(stories.length - 1, i));
        stories.forEach((s, n) => s.classList.toggle('current', n === current));
        document.getElementById('position').textContent = `Story ${current + 1} of ${stories.length}`;
      };
      document.addEventListener('keydown', (event) => {
        if (event.target.closest('input, textarea, select')) return;
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        const key = event.key.toLowerCase();
        if (key === 'j') show(current + 1);
        else if (key === 'k') show(current - 1);
        else if (key === 's') {
          event.preventDefault();
          document.getElementById('story-search').focus();
        }
      });
    </script>
  </body>
</html>
