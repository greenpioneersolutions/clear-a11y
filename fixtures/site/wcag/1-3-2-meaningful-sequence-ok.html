<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heater cleaning steps in reading order</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0 16px; }
      a { color: #1a4f8b; }
      button { font: inherit; }
      img, video, audio { max-width: 100%; }
      img, video { height: auto; }
      figure { margin: 16px 0; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
      .steps { display: flex; flex-direction: column; gap: 8px; padding: 0; list-style: none; }
      .steps p { margin: 0; padding: 8px; border-left: 4px solid #1a4f8b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cleaning the heater filter</h1>
      <!-- Correct pattern: an ordered list whose source order is the visual order. -->
      <ol class="steps" id="cleaning-steps">
        <li><p>Switch the heater off and unplug it.</p></li>
        <li><p>Wait 30 minutes for the heater to cool down.</p></li>
        <li><p>Remove the filter cover.</p></li>
        <li><p>Rinse the filter under cold water and let it dry.</p></li>
      </ol>
    </main>
  </body>
</html>
