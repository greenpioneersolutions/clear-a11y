<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live keynote stream with captions</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0 16px; }
      a { color: #1a4f8b; }
      button { font: inherit; }
      img, video, audio { max-width: 100%; }
      img, video { height: auto; }
      figure { margin: 16px 0; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
      figure { margin: 16px 0; max-width: 480px; }
      video { background: #222; display: block; }
      .live { display: inline-block; background: #a51d2d; color: #fff; padding: 0 6px; font-weight: bold; }
    </style>
  </head>
  <body>
    <main>
      <h1>Spring keynote <span class="live">LIVE</span></h1>
      <!-- Correct pattern: the live stream carries a captions track (written by a live captioner). -->
      <figure>
        <video id="live-keynote" controls muted autoplay playsinline width="480" height="270">
          <track kind="captions" src="../_assets/media/live-keynote.en.vtt" srclang="en" label="English (live)" default />
        </video>
        <figcaption>Streaming now from the main stage, with live captions.</figcaption>
      </figure>
    </main>
    <script>
      // A live source made on the page (no network): a canvas stream, like a WebRTC broadcast.
      const canvas = document.createElement('canvas');
      canvas.width = 480;
      canvas.height = 270;
      const g = canvas.getContext('2d');
      let frame = 0;
      setInterval(() => {
        g.fillStyle = '#222';
        g.fillRect(0, 0, 480, 270);
        g.fillStyle = '#fff';
        g.font = '24px sans-serif';
        g.fillText('Keynote ' + (frame++ % 2 ? '·' : ' '), 20, 140);
      }, 500);
      document.getElementById('live-keynote').srcObject = canvas.captureStream(2);
    </script>
  </body>
</html>
