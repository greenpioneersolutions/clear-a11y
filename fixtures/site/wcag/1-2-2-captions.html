<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product tour video without captions</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0 16px; }
      a { color: #1a4f8b; }
      button { font: inherit; }
      img, video, audio { max-width: 100%; }
      img, video { height: auto; }
      figure { margin: 16px 0; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
      figure { margin: 16px 0; max-width: 480px; }
      video { background: #222; display: block; }
    </style>
  </head>
  <body>
    <main>
      <h1>Take the product tour</h1>
      <!-- Seeded barrier: the tour video has an audio description track and a transcript, but no
           captions. WCAG 1.2.2. -->
      <figure>
        <video id="product-tour" controls width="480" height="270" preload="none">
          <source src="../_assets/media/product-tour.mp4" type="video/mp4" />
          <track kind="descriptions" src="../_assets/media/product-tour.descriptions.vtt" srclang="en" label="Audio descriptions" />
        </video>
        <figcaption>Product tour, 2 minutes. <a href="#transcript">Read the transcript</a></figcaption>
      </figure>
      <section id="transcript" aria-labelledby="transcript-title">
        <h2 id="transcript-title">Transcript</h2>
        <p>[Upbeat music] Narrator: Planner keeps every project in one place.</p>
      </section>
    </main>
  </body>
</html>
