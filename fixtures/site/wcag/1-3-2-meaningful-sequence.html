<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heater cleaning steps in the wrong reading order</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0 16px; }
      a { color: #1a4f8b; }
      button { font: inherit; }
      img, video, audio { max-width: 100%; }
      img, video { height: auto; }
      figure { margin: 16px 0; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
      .steps { display: flex; flex-direction: column; gap: 8px; padding: 0; list-style: none; }
      .steps p { margin: 0; padding: 8px; border-left: 4px solid #1a4f8b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cleaning the heater filter</h1>
      <!-- Seeded barrier: CSS `order` shows the steps in the safe order, but the DOM (what screen
           readers read) says to remove the cover before the heater has cooled. WCAG 1.3.2. -->
      <div class="steps" id="cleaning-steps">
        <p style="order: 1">Switch the heater off and unplug it.</p>
        <p style="order: 3" id="step-remove">Remove the filter cover.</p>
        <p style="order: 2" id="step-wait">Wait 30 minutes for the heater to cool down.</p>
        <p style="order: 4">Rinse the filter under cold water and let it dry.</p>
      </div>
    </main>
  </body>
</html>
