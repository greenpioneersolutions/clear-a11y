<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Returns policy with colour-only links</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; margin: 0 16px; }
      a { color: #1a4f8b; }
      button { font: inherit; }
      img, video, audio { max-width: 100%; }
      img, video { height: auto; }
      figure { margin: 16px 0; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Returns</h1>
      <!-- Seeded barrier: the link in the paragraph is only distinguished by a colour that has less
           than 3:1 contrast with the surrounding text, and no underline. WCAG 1.4.1. -->
      <p>You can return most items within 30 days. Read the
        <a id="returns-link" href="#policy" style="color: #2a5db0; text-decoration: none">full returns policy</a>
        before you send anything back.</p>
      <h2 id="policy">Full returns policy</h2>
      <p>Items must be unused and in their original packaging.</p>
    </main>
  </body>
</html>
