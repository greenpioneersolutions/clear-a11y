<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Correct pattern: delivery options disclosure</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      .options { display: none; }
      .options.open { display: block; }
      button { font: inherit; padding: 8px 12px; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Checkout</h1>
      <!-- Correct pattern (APG disclosure): aria-expanded follows the section's visibility. -->
      <button id="delivery-toggle" type="button" aria-expanded="false" aria-controls="delivery-options">Delivery options</button>
      <div id="delivery-options" class="options">
        <p>Standard delivery: 3 to 5 working days, free.</p>
        <p>Express delivery: next working day, 9 euros.</p>
      </div>
      <details>
        <summary>Returns</summary>
        <p>Return any item within 30 days.</p>
      </details>
    </main>
    <script>
      const toggle = document.getElementById('delivery-toggle');
      toggle.addEventListener('click', () => {
        const open = document.getElementById('delivery-options').classList.toggle('open');
        toggle.setAttribute('aria-expanded', String(open));
      });
    </script>
  </body>
</html>
