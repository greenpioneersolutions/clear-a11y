<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment: card error not linked to the field</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      .field { display: flex; flex-direction: column; max-width: 360px; margin-bottom: 16px; }
      .error { color: #a51d2d; font-size: 14px; }
      input, button { font: inherit; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Payment</h1>
      <!-- Seeded barrier: after a failed submit focus moves to the card field and it gets
           aria-invalid, but the error text is not referenced by aria-describedby, so a screen
           reader only says "Card number, invalid entry" and never what is wrong (3.3.1, 1.3.1). -->
      <form id="payment" action="#" novalidate>
        <div class="field">
          <label for="card-number">Card number</label>
          <input id="card-number" inputmode="numeric" autocomplete="cc-number" />
          <span id="card-number-error" class="error"></span>
        </div>
        <button type="submit">Pay 120 euros</button>
      </form>
    </main>
    <script>
      document.getElementById('payment').addEventListener('submit', (event) => {
        event.preventDefault();
        const input = document.getElementById('card-number');
        const error = document.getElementById('card-number-error');
        if (!/^\d{16}$/.test(input.value)) {
          input.setAttribute('aria-invalid', 'true');
          error.textContent = 'Enter the 16 digits on the front of your card.';
          input.focus();
        } else {
          input.removeAttribute('aria-invalid');
          error.textContent = '';
        }
      });
    </script>
  </body>
</html>
