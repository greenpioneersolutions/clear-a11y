<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product: status message not announced</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Trail running shoe</h1>
      <button id="add-to-cart" type="button">Add to cart</button>
      <!-- Seeded barrier: confirmation appears visually but is not a live region (4.1.3). -->
      <div id="cart-status"></div>
    </main>
    <script>
      document.getElementById('add-to-cart').addEventListener('click', () => {
        document.getElementById('cart-status').textContent = 'Added to cart. 1 item in your cart.';
      });
    </script>
  </body>
</html>
