<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop: visible label not in the accessible name</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      input, button { font: inherit; padding: 6px 8px; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <header>
      <form role="search" action="#">
        <label for="site-search">Product search</label>
        <input id="site-search" type="search" name="q" />
        <!-- Seeded barrier: the button reads "Search" but aria-label renames it "Find products".
             Saying "click Search" with speech input does nothing (2.5.3). -->
        <button id="search-button" type="submit" aria-label="Find products">Search</button>
      </form>
    </header>
    <main>
      <h1>Trail running shoes</h1>
    </main>
  </body>
</html>
