<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in: error summary injected silently</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; }
      .field { display: flex; flex-direction: column; max-width: 360px; margin-bottom: 16px; }
      .error { color: #a51d2d; font-size: 14px; }
      input, button { font: inherit; }
      :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <!-- Seeded barrier: on a failed submit the summary and field errors appear, the fields are
           correctly linked to their errors, but nothing is a live region and focus stays on the
           button: screen reader users are not told the form was rejected (4.1.3). -->
      <div id="error-summary" class="error"></div>
      <form id="signin" action="#" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" aria-describedby="email-error" />
          <span id="email-error" class="error"></span>
        </div>
        <button type="submit">Sign in</button>
      </form>
    </main>
    <script>
      document.getElementById('signin').addEventListener('submit', (event) => {
        event.preventDefault();
        const input = document.getElementById('email');
        const empty = !input.value;
        if (empty) input.setAttribute('aria-invalid', 'true');
        else input.removeAttribute('aria-invalid');
        document.getElementById('email-error').textContent = empty ? 'Enter your email address.' : '';
        document.getElementById('error-summary').textContent = empty ? 'There is a problem: enter your email address.' : '';
      });
    </script>
  </body>
</html>
